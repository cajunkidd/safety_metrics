<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Safety Metrics{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Safety Metrics Dashboard</div>
    <nav>
      {% if user %}
        <a href="/">Dashboard</a>
        {% if user.role == 'admin' %}
          <a href="/upload">Upload Data</a>
          <a href="/users">Users</a>
        {% endif %}
        <span class="user-info">{{ user.username }} ({{ user.role }})</span>
        <form action="/logout" method="post" class="inline-form">
          <button class="link-btn" type="submit">Log out</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
